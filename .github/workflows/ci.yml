name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint-format-import-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check app tests scripts

      - name: Format check
        run: ruff format --check app tests scripts

      - name: Import check
        run: python -m compileall app tests scripts

      - name: Test
        env:
          PYTHONPATH: .
          APP_ENV: development
          ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
          BINANCE_MASTER_KEY: ci-placeholder-master-key-32-characters
          DATABASE_URL: sqlite:///./ci-test.db
        run: python -m pytest tests -q

  deploy:
    name: deploy-placeholder
    runs-on: ubuntu-latest
    needs: quality
    if: false
    steps:
      - run: echo "Deploy is intentionally separated from CI quality gates."
