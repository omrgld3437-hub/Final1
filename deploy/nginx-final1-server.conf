# =========================
# Ayserose - ornek server blogu
# Nasil uygulanir:
#   1. Sunucuda C:\nginx\conf\nginx.conf dosyasini acin.
#   2. "ayserose.com" server { ... } blogunu bu dosyadaki
#      server blogu ile degistirin (X-Forwarded-Proto, proxy_cache off vb. eklenir).
#   3. Kaydedin. C:\nginx dizininde: nginx -s reload
# =========================
    server {
        listen 80;
        server_name ayserose.com www.ayserose.com;

        location / {
            proxy_pass http://final1_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Domain uzerinden guncel gorunum: onbellek kapali
            proxy_cache off;
            proxy_no_cache 1;
            proxy_buffering off;
        }
    }
