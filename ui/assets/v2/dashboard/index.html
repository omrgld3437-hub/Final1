<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14151a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Ayserose" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ayserose" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      name="description"
      content="Ayserose hızlı ve güvenli işlem yönetim paneli."
    />
    <title>Ayserose</title>
    <link rel="manifest" href="/ui/assets/v2/dashboard/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ui/assets/pwa/ayserose-plain-v4-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ui/assets/pwa/ayserose-plain-v4-180.png" />
    <link rel="preload" as="image" href="/ui/assets/pwa/ayserose-plain-v4-192.png" />
    <script>
      (function () {
        var shouldShow = window.matchMedia("(max-width:639px)").matches;
        var isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        window.__ayseroseSplashShouldShow = shouldShow;
        if (isStandalone) {
          document.documentElement.classList.add("mobile-pwa-standalone");
        }
        if (shouldShow) {
          window.__ayseroseSplashStartedAt = performance.now();
          document.documentElement.classList.add("mobile-splash-pending");
        }
      })();
    </script>
    <style>
      .ar-ayse{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-style:normal;color:#c280d4;letter-spacing:0.01em;}
      .ar-rose{font-family:Georgia,'Times New Roman',serif;font-weight:300;font-style:italic;color:#e896c4;letter-spacing:0.04em;}
      #mobile-app-splash{display:none;background:#14151a}
      @media (max-width:639px){
        html.mobile-splash-pending #mobile-app-splash{
          position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
          min-height:100dvh;overflow:hidden;color:#f5f3f7;
          background:
            radial-gradient(circle at 14% 14%,rgba(190,100,230,.12),transparent 34%),
            radial-gradient(circle at 90% 32%,rgba(122,92,246,.09),transparent 32%),
            #14151a;
          opacity:1;transition:opacity .16s ease-out;
        }
        #mobile-app-splash::before{
          content:"";position:absolute;inset:0;opacity:.22;
          background-image:
            radial-gradient(circle at 15% 20%,rgba(255,255,255,.8) 0 1px,transparent 1.4px),
            radial-gradient(circle at 80% 18%,rgba(255,255,255,.65) 0 1px,transparent 1.2px),
            radial-gradient(circle at 62% 72%,rgba(255,255,255,.45) 0 1px,transparent 1.2px);
          background-size:180px 180px,260px 260px,220px 220px;
        }
        #mobile-app-splash .mobile-splash-brand{
          position:relative;display:flex;align-items:center;gap:13px;
          transform:translateY(calc((env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))/2));
        }
        html.mobile-pwa-standalone #mobile-app-splash .mobile-splash-brand{
          transform:translateY(calc(env(safe-area-inset-top,0px)/-2));
        }
        #mobile-app-splash .mobile-splash-logo{
          display:grid;width:62px;height:62px;place-items:center;overflow:hidden;
          border:1px solid rgba(199,125,255,.2);border-radius:20px;
          background:radial-gradient(circle at 50% 52%,rgba(196,125,255,.2),transparent 63%);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 56px rgba(109,53,181,.28);
        }
        #mobile-app-splash img{width:58px;height:58px;object-fit:contain}
        #mobile-app-splash strong{
          font:600 24px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          letter-spacing:.09em;
        }
        #mobile-app-splash.is-leaving{opacity:0;pointer-events:none}
      }
      @media (prefers-reduced-motion:reduce){
        #mobile-app-splash,#mobile-app-splash .mobile-splash-brand{animation:none;transition:none}
      }
    </style>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById("mobile-app-splash");
        if (!splash) return;
        splash.classList.add("is-leaving");
        window.setTimeout(function () {
          splash.remove();
          document.documentElement.classList.remove("mobile-splash-pending");
        }, 160);
      }, 5000);
    </script>
    <script type="module" crossorigin src="/ui/assets/v2/dashboard/assets/index-DNHqItZO.js"></script>
    <link rel="modulepreload" crossorigin href="/ui/assets/v2/dashboard/assets/icons-CFvfxxla.js">
    <link rel="modulepreload" crossorigin href="/ui/assets/v2/dashboard/assets/react-Cxdq1qSm.js">
    <link rel="stylesheet" crossorigin href="/ui/assets/v2/dashboard/assets/index-B7M__RYh.css">
  </head>
  <body>
    <div id="mobile-app-splash" role="status" aria-label="Ayserose açılıyor">
      <div class="mobile-splash-brand">
        <span class="mobile-splash-logo">
          <img src="/ui/assets/pwa/ayserose-plain-v4-192.png" alt="" width="58" height="58" />
        </span>
        <strong>ayserose</strong>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Ayserose panelini kullanmak için JavaScript'i etkinleştirin.</noscript>
  </body>
</html>
